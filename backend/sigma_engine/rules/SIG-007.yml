title: SSH 暴力破解
id: aaaaaaaa-0001-0000-0000-000000000007
status: test
description: 检测对 SSH 服务的异常连接
date: 2026/08/24
author: SOC Platform
license: SOC-Internal
logsource:
  category: auth
  product: linux
detection:
  sel_port:
    dst_port: 22
  sel_event:
    event|contains:
      - BRUTE_FORCE
      - SSH_BRUTE
      - LOGIN_FAIL
      - 登录失败
      - 暴力破解
      - 爆破
  # v5 修复:必须同时满足 SSH 端口 AND 登录失败特征。
  # 此前 "1 of sel_*"(OR) 仅凭 dst_port=22 就命中, 正常 SSH 登录被误判为
  # 暴力破解并经 FastPath 强信号路径误封禁良性用户 (2026-09-01 复现)。
  condition: sel_port and sel_event
level: high
tags:
  - attack.credential-access.t1110.001
falsepositives:
  - dev ssh admin bursts
x-soc-id: SIG-007
x-soc-confidence: medium
x-soc-action: block_ip
x-soc-attack_type: brute_force
x-soc-severity: high
# 聚合仅用于 Flink 升级阈值；单条结论型 BRUTE_FORCE 事件仍应立即命中
x-soc-aggregation:
  func: count
  field: src_ip
  op: ">"
  threshold: 1
  timeframe: 5m
