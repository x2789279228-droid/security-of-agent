title: HTTP 登录爆破检测
id: aaaaaaaa-0001-0000-0000-000000000001
status: test
description: 检测对登录接口的高频访问
date: 2026/08/24
author: SOC Platform
license: SOC-Internal
logsource:
  category: proxy
  product: generic
detection:
