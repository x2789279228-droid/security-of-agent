id: POL-PORT-SCAN
name: 端口扫描限速
enabled: true
description: 端口扫描：限速 + 告警
match:
  threat_type: PORT_SCAN
  min_confidence: 0.4
  min_severity: low
actions:
- name: rate_limit
  params:
    bandwidth_kbps: 500
- name: send_alert
  params:
    severity: medium
auto_execute: true
require_approval: false
priority: 70
cooldown_minutes: 10
