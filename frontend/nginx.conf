# ── 安全响应头 (两个 server 块统一使用; 注意 nginx add_header 不跨级继承,
#    location 内若定义任何 add_header, 必须在此处补齐完整集合) ──
# server 80: 平台 Web 前端
server {
    listen 80;
    server_name localhost;

    # 隐藏 Nginx 版本号 (Server 头与错误页)
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 浏览器 OTel span 导出: /otlp/v1/traces → collector OTLP HTTP 4318
    # 尾斜杠使 /otlp/ 前缀被替换为 /, 转发为 /v1/traces (collector OTLP HTTP 端点)
    location /otlp/ {
        proxy_pass http://otel-collector:4318/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~* \.(css|js)$ {
        # 本 location 定义了 add_header, 会覆盖 server 级全部安全头 → 此处补齐
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

# server 8080 (宿主 3002): Flink Dashboard 认证反代 + Grafana 反代
# Flink 开源版 REST 无内置认证, 原 8081 直连暴露泄露集群配置/日志,
# 现收敛为本 server 块: Basic Auth + 安全头, 8081 不再映射宿主。
# Grafana 亦经本块子路径 /grafana/ 反代 (GF_SERVER_ROOT_URL 需含 /grafana/)。
server {
    listen 8080;
    server_name _;

    server_tokens off;

    auth_basic "SOC Flink Dashboard";
    # 由 tools/gen-htpasswd.sh 生成并经 docker-compose 挂载
    auth_basic_user_file /etc/nginx/flink.htpasswd;

    # 安全头 (同上集合)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /grafana/ {
        # 保持 /grafana/ 前缀 (Grafana serve_from_sub_path=true), 无尾部斜杠
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Jaeger Query UI (v2 base_path=/jaeger, 反代保持前缀)
    location /jaeger/ {
        proxy_pass http://jaeger:16686/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Temporal Web UI (base_path=/temporal, 反代保持前缀; 展示 4 层 Agent 编排)
    location /temporal/ {
        proxy_pass http://temporal-ui:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://flink-jobmanager:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}
