# ── TaskManager 共享定义 (3 副本 × 5 slots = 集群总并发槽 15) ──
# 经 <<: *flink-taskmanager 展开为 flink-taskmanager-1/2/3;
# 各副本仅差异化 container_name 与宿主机指标端口 (9251/9252/9253 → 容器 9250)
x-flink-taskmanager: &flink-taskmanager
  image: ghcr.io/x2789279228-droid/soc-flink:${IMAGE_TAG:-dev}
  build:
    context: ./flink-jobs
    dockerfile: Dockerfile
  restart: always
  command: taskmanager
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      taskmanager.numberOfTaskSlots: 5
      # ── 与 JobManager 对齐的状态/checkpoint 配置 ──
      state.backend.type: rocksdb
      state.checkpoint-storage: filesystem
      state.checkpoints.dir: file:///var/flink-state/checkpoints
      state.backend.incremental: true
      metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      metrics.reporter.prom.port: 9250
    KAFKA_BOOTSTRAP: kafka:9092
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  volumes:
    # 与 JobManager 共享持久化状态卷 (checkpoint 可见性)
    - flink_state:/var/flink-state
  depends_on:
    - flink-jobmanager

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    container_name: shared-memory-pg
    restart: always
    environment:
      POSTGRES_DB: shared_memory
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shared_memory"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.2-alpine
    container_name: shared-memory-redis
    restart: always
    # 强制密码 + protected-mode;端口仅绑 127.0.0.1 供本机调试,容器间走 Docker 内网
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}", "--protected-mode", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Qdrant 向量数据库 (RAG 知识库检索; 端口仅绑 127.0.0.1, 容器间走 Docker 内网) ──
  qdrant:
    image: qdrant/qdrant:v1.15.1
    # 可重现: 运行 `docker pull qdrant/qdrant:v1.15.1` 后追加 `@sha256:<digest>`
    container_name: soc-qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333"   # REST API
      - "127.0.0.1:6334:6334"   # gRPC (可选)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /collections HTTP/1.0\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 2>/dev/null | grep -qiE \"HTTP/1.[01] 200\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Kafka 消息总线 (KRaft 模式, 无需 ZooKeeper) ──
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: soc-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9095
      # 三监听: PLAINTEXT 容器内(9092,不对外) / SASL_SSL 外部加密+认证(9093) / PLAINTEXT_HOST 本机工具(9094,仅127.0.0.1)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,SASL_SSL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9095,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,SASL_SSL://${KAFKA_PUBLIC_HOST:?KAFKA_PUBLIC_HOST must be set in .env}:9093,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_SSL:SASL_SSL,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # ── SASL/SCRAM 认证 (外部日志源必须持账号+证书才能推送, 账号创建见 tools/create-kafka-users.sh) ──
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/kafka_jaas.conf
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 单 broker 事务: 内部主题 __transaction_state 需 RF=1 (默认 3 无法在单 broker 建主题,
      # 导致 Flink KafkaSink EXACTLY_ONCE 的 InitProducerId 超时失败)
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Flink KafkaSink EXACTLY_ONCE 默认 transaction.timeout.ms=1h,
      # 需放行 broker 侧上限 (默认 15min, 否则 InitProducerId 报超时过大)
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 3600000
      # ── 数据保留策略（全局默认 7 天 + 1GB 上限） ──
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 107374182
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_COMPRESSION_TYPE: lz4
      # ── SSL/TLS 配置（证书由 tools/gen-kafka-certs.sh 生成, SASL_SSL 监听器复用） ──
      # cp-kafka 约定: FILENAME + 凭据文件, 镜像 entrypoint 自动装配 ssl.*.location
      KAFKA_SSL_KEYSTORE_FILENAME: broker-keystore.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: broker-keystore-creds
      KAFKA_SSL_KEY_CREDENTIALS: broker-key-creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: ca-truststore.p12
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore-creds
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      # 9092 不映射宿主(仅容器网络); 9093 对外(SASL_SSL 保护); 9094 仅本机
      - "9093:9093"
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./certs/kafka:/etc/kafka/secrets
      - ./config/kafka/kafka_jaas.conf:/etc/kafka/kafka_jaas.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka UI (竞赛演示可视化, 登录认证保护) ──
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: soc-kafka-ui
    restart: always
    environment:
      KAFKA_CLUSTERS_0_NAME: SOC-Kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      # 登录认证: 未认证不允许访问
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?KAFKA_UI_PASSWORD must be set in .env}
    ports:
      # 注: 不用 8082/8083 —— 宿主机 QQ 会抢占这些端口造成连接随机分流
      - "18082:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # ── Confluent Schema Registry (Schema 版本管理) ──
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: soc-schema-registry
    restart: always
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
    ports:
      - "127.0.0.1:8085:8081"
    depends_on:
      kafka:
        condition: service_healthy

  # ── Flink 流处理引擎 (生产级: RocksDB + 持久化 checkpoint + Exactly-Once) ──
  flink-jobmanager:
    image: ghcr.io/x2789279228-droid/soc-flink:${IMAGE_TAG:-dev}
    build:
      context: ./flink-jobs
      dockerfile: Dockerfile
    container_name: soc-flink-jobmanager
    restart: always
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        # ── 状态后端: RocksDB (生产级, 支持大状态 + 增量 checkpoint) ──
        state.backend.type: rocksdb
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///var/flink-state/checkpoints
        state.savepoints.dir: file:///var/flink-state/savepoints
        state.backend.incremental: true
        # ── Checkpoint: Exactly-Once (与 KafkaSink 事务配合, 重启/重放不重不漏) ──
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.interval: 60s
        execution.checkpointing.min-pause: 30s
        execution.checkpointing.timeout: 10min
        execution.checkpointing.max-concurrent-checkpoints: 1
        # ── 容错: 失败自动重启 (fixed-delay 3 次, 间隔 10s) ──
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.delay: 10s
        restart-strategy.fixed-delay.attempts: 3
        # ── 并行度: 由配置文件统一驱动 (不再在代码硬编码, 按 topic 分区弹性扩容) ──
        # 3 个默认作业 × 5 = 15 槽, 与 3 副本 TaskManager × 5 slots 布局精确匹配
        parallelism.default: 5
        # ── 指标: Prometheus Reporter (容器端口 9250) ──
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250
        # 注: Flink 1.19 的 OTel 系统 trace reporter (checkpoint/init spans) 需额外
        # 插件 jar (flink-metrics-otel 仅存在 2.x), Docker 镜像未内置 → 每事件 span
        # 由作业内 TraceUtil (OTel SDK) 导出, 见 flink-jobs/src/.../TraceUtil.java
      KAFKA_BOOTSTRAP: kafka:9092
      # 每事件 OTel span 导出端点 (TraceUtil 读取)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      # 生产不映射; 仅开发时可通过 frontend:3002 认证反代访问
      - "127.0.0.1:9250:9250"
    volumes:
      # 持久化状态卷: checkpoint/savepoint 跨容器重建保留 (生产关键)
      - flink_state:/var/flink-state
    # REST/Dashboard 不映射宿主: 外部经 frontend:3002 (Basic Auth) 访问。
    # 作业提交由 flink-job-submitter(守护) 自动完成, 手动重提仍可用
    #   `docker compose exec flink-jobmanager /opt/flink/submit-jobs.sh`
    depends_on:
      kafka:
        condition: service_healthy

  # ── TaskManager ×3 (每副本 5 slots, 集群总并发槽 = 15) ──
  # 生产级多副本: 单节点故障时其余 TM 仍可承接任务 (并行度 5 × 3 作业需 15 槽)
  flink-taskmanager-1:
    <<: *flink-taskmanager
    container_name: soc-flink-taskmanager-1
    ports:
      - "127.0.0.1:9251:9250"   # Prometheus/调试 (副本 1)
  flink-taskmanager-2:
    <<: *flink-taskmanager
    container_name: soc-flink-taskmanager-2
    ports:
      - "127.0.0.1:9252:9250"   # Prometheus/调试 (副本 2)
  flink-taskmanager-3:
    <<: *flink-taskmanager
    container_name: soc-flink-taskmanager-3
    ports:
      - "127.0.0.1:9253:9250"   # Prometheus/调试 (副本 3)

  # ── Flink 作业守护提交器 (Job 启动自动化) ──
  # 常驻轮询: JM 就绪 + 总槽 ≥ 15 时自动执行幂等 submit-jobs.sh。
  # `docker compose up -d` 后无需手动命令即自动提交核心作业;
  # JM/TM 重启或作业失败后自动补交。手动重提不再作为必需步骤。
  flink-job-submitter:
    image: ghcr.io/x2789279228-droid/soc-flink:${IMAGE_TAG:-dev}
    build:
      context: ./flink-jobs
      dockerfile: Dockerfile
    container_name: soc-flink-job-submitter
    restart: always
    # 复用同一 soc-flink 镜像; 绕过官方 flink docker-entrypoint,
    # 直接以 bash 运行守护脚本. host/port 由 auto-submit.sh 读取容器 env JM_HOST/JM_PORT.
    entrypoint: ["/bin/bash", "-c", "exec /opt/flink/auto-submit.sh"]
    environment:
      JM_HOST: flink-jobmanager
      JM_PORT: "8081"
      POLL_SECONDS: "${FLINK_AUTO_SUBMIT_POLL_SECONDS:-30}"
      AUTO_SUBMIT_MIN_SLOTS: "15"
      KAFKA_BOOTSTRAP: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_started

  backend:
    image: ghcr.io/x2789279228-droid/soc-backend:${IMAGE_TAG:-dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shared-memory-backend
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 强制 UTF-8 (python:3.12-slim 没装 locales, 默认 POSIX/ASCII 会让含中文的 .py SyntaxError)
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      SHARED_MEMORY_DATABASE_URL: postgresql+asyncpg://admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/shared_memory
      SHARED_MEMORY_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      # 必填：请在运行前设置 API Key，否则 LLM/Embedding 将返回降级响应
      SHARED_MEMORY_LLM_API_KEY: ${SHARED_MEMORY_LLM_API_KEY:?LLM_API_KEY_REQUIRED}
      SHARED_MEMORY_LLM_BASE_URL: ${SHARED_MEMORY_LLM_BASE_URL:-https://api.xiaomimimo.com/v1}
      SHARED_MEMORY_LLM_MODEL: ${SHARED_MEMORY_LLM_MODEL:-mimo-v2.5}
      # LLM 成本控制 (日预算 / 输入输出单价, 单位 ¥/千tokens; 0=不估算费用)
      SHARED_MEMORY_LLM_DAILY_BUDGET_TOKENS: ${SHARED_MEMORY_LLM_DAILY_BUDGET_TOKENS:-0}      # 0=无上限(默认: LLM审计永不因预算降级); =0 表示无限/设正数则显式上限
      SHARED_MEMORY_LLM_BUDGET_UNLIMITED: ${SHARED_MEMORY_LLM_BUDGET_UNLIMITED:-true}       # true=预算只记账不关(审计/模块); false=硬门禁(回退)
      SHARED_MEMORY_LLM_PRICE_INPUT_PER_1K_TOKENS: ${SHARED_MEMORY_LLM_PRICE_INPUT_PER_1K_TOKENS:-0.001}
      SHARED_MEMORY_LLM_PRICE_OUTPUT_PER_1K_TOKENS: ${SHARED_MEMORY_LLM_PRICE_OUTPUT_PER_1K_TOKENS:-0.002}
      SHARED_MEMORY_EMBEDDING_API_KEY: ${SHARED_MEMORY_EMBEDDING_API_KEY:?EMBEDDING_API_KEY_REQUIRED}
      SHARED_MEMORY_EMBEDDING_BASE_URL: ${SHARED_MEMORY_EMBEDDING_BASE_URL:-https://maas-api.cn-huabei-1.xf-yun.com/v2}
      SHARED_MEMORY_EMBEDDING_MODEL: ${SHARED_MEMORY_EMBEDDING_MODEL:-mimo-v2.5}
      SHARED_MEMORY_EMBEDDING_DIM: ${SHARED_MEMORY_EMBEDDING_DIM:-768}
      # 安全认证配置
      SHARED_MEMORY_JWT_SECRET: ${SHARED_MEMORY_JWT_SECRET:?JWT_SECRET_REQUIRED}
      SHARED_MEMORY_ADMIN_USER: ${SHARED_MEMORY_ADMIN_USER:-admin}
      SHARED_MEMORY_ADMIN_PASSWORD: ${SHARED_MEMORY_ADMIN_PASSWORD:?ADMIN_PASSWORD_REQUIRED}
      # 整体加引号: 插值结果 ["..."] 否则会被 YAML 解析成数组,
      # 而 compose environment 值必须是标量; 后端按 JSON 字符串解析
      SHARED_MEMORY_ALLOWED_ORIGINS: '${SHARED_MEMORY_ALLOWED_ORIGINS:-["http://localhost:3001"]}'
      # 响应引擎 SSH 传输配置
      SHARED_MEMORY_RESPONSE_TRANSPORT_MODE: ${SHARED_MEMORY_RESPONSE_TRANSPORT_MODE:-auto}
      SHARED_MEMORY_RESPONSE_SSH_HOST: ${SHARED_MEMORY_RESPONSE_SSH_HOST:-host.docker.internal}
      SHARED_MEMORY_RESPONSE_SSH_PORT: ${SHARED_MEMORY_RESPONSE_SSH_PORT:-22}
      SHARED_MEMORY_RESPONSE_SSH_USER: ${SHARED_MEMORY_RESPONSE_SSH_USER:-Admin}
      SHARED_MEMORY_RESPONSE_SSH_KEY_FILE: ${SHARED_MEMORY_RESPONSE_SSH_KEY_FILE:-/tmp/ssh/id_rsa}
      # Firewall VM (v3 SSH 链路性能验证用, 指向 soc-firewall 容器)
      SHARED_MEMORY_FW_SSH_HOST: ${SHARED_MEMORY_FW_SSH_HOST:-soc-firewall}
      SHARED_MEMORY_FW_SSH_PORT: ${SHARED_MEMORY_FW_SSH_PORT:-22}
      SHARED_MEMORY_FW_SSH_USER: ${SHARED_MEMORY_FW_SSH_USER:-root}
      SHARED_MEMORY_FW_SSH_PASSWORD: ${SHARED_MEMORY_FW_SSH_PASSWORD:-}
      SHARED_MEMORY_FW_USE_SUDO: ${SHARED_MEMORY_FW_USE_SUDO:-false}
      # Kafka 消息总线
      SHARED_MEMORY_KAFKA_ENABLED: ${SHARED_MEMORY_KAFKA_ENABLED:-true}
      SHARED_MEMORY_KAFKA_BOOTSTRAP: kafka:9092
      # Qdrant 向量数据库 (RAG 检索; 容器间走 Docker 内网, 端口仅绑 127.0.0.1)
      SHARED_MEMORY_QDRANT_URL: ${SHARED_MEMORY_QDRANT_URL:-http://qdrant:6333}
      SHARED_MEMORY_QDRANT_COLLECTION: ${SHARED_MEMORY_QDRANT_COLLECTION:-soc_knowledge_chunks}
      # 真实 embedding 维度=768 (与 SHARED_MEMORY_EMBEDDING_DIM 一致)
      SHARED_MEMORY_QDRANT_VECTOR_SIZE: ${SHARED_MEMORY_QDRANT_VECTOR_SIZE:-768}
      # Confluent Schema Registry (Flink↔Python 跨运行时 Schema 契约)
      SHARED_MEMORY_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # OpenTelemetry (标准 trace → otel-collector → Tempo)
      SHARED_MEMORY_OTEL_ENABLED: "true"
      SHARED_MEMORY_OTEL_ENDPOINT: http://otel-collector:4317
      SHARED_MEMORY_ENV_NAME: ${SHARED_MEMORY_ENV_NAME:-dev}
      # Temporal (4 层 Agent 编排; 默认启用, 失败降级 async)
      SHARED_MEMORY_TEMPORAL_ENABLED: ${SHARED_MEMORY_TEMPORAL_ENABLED:-true}
      SHARED_MEMORY_TEMPORAL_HOST: temporal:7233
      SHARED_MEMORY_TEMPORAL_NAMESPACE: default
      SHARED_MEMORY_TEMPORAL_TASK_QUEUE: audit-pipeline
      # 敏感字段加密（Fernet key, 生成: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"）
      SHARED_MEMORY_FIELD_ENCRYPTION_KEY: ${SHARED_MEMORY_FIELD_ENCRYPTION_KEY:-}
      # ── B 类高级能力（NDR/EDR/威胁情报/0day/反钓鱼; 默认关闭, 演示经 .env.demo 开启）──
      SHARED_MEMORY_CAPTURE_ENABLED: ${SHARED_MEMORY_CAPTURE_ENABLED:-false}
      SHARED_MEMORY_CAPTURE_INTERFACE: ${SHARED_MEMORY_CAPTURE_INTERFACE:-eth0}
      SHARED_MEMORY_CAPTURE_METHOD: ${SHARED_MEMORY_CAPTURE_METHOD:-libpcap}
      SHARED_MEMORY_MITM_ENABLED: ${SHARED_MEMORY_MITM_ENABLED:-false}
      SHARED_MEMORY_EDR_ENABLED: ${SHARED_MEMORY_EDR_ENABLED:-false}
      SHARED_MEMORY_INTEL_ENABLED: ${SHARED_MEMORY_INTEL_ENABLED:-false}
      SHARED_MEMORY_MISP_URL: ${SHARED_MEMORY_MISP_URL:-}
      SHARED_MEMORY_MISP_API_KEY: ${SHARED_MEMORY_MISP_API_KEY:-}
      SHARED_MEMORY_TAXII_URL: ${SHARED_MEMORY_TAXII_URL:-}
      SHARED_MEMORY_TAXII_USER: ${SHARED_MEMORY_TAXII_USER:-}
      SHARED_MEMORY_TAXII_PASSWORD: ${SHARED_MEMORY_TAXII_PASSWORD:-}
      SHARED_MEMORY_SANDBOX_ENABLED: ${SHARED_MEMORY_SANDBOX_ENABLED:-false}
      SHARED_MEMORY_SANDBOX_TYPE: ${SHARED_MEMORY_SANDBOX_TYPE:-cape}
      SHARED_MEMORY_SANDBOX_API_URL: ${SHARED_MEMORY_SANDBOX_API_URL:-http://host.docker.internal:8899}
      SHARED_MEMORY_SANDBOX_AUTO_SUBMIT: ${SHARED_MEMORY_SANDBOX_AUTO_SUBMIT:-false}
      # B 类 LLM 增强(可选叙事/解读)
      SHARED_MEMORY_LLM_EDR_ENABLED: ${SHARED_MEMORY_LLM_EDR_ENABLED:-false}
      SHARED_MEMORY_LLM_INTEL_ENABLED: ${SHARED_MEMORY_LLM_INTEL_ENABLED:-false}
      SHARED_MEMORY_LLM_SANDBOX_ENABLED: ${SHARED_MEMORY_LLM_SANDBOX_ENABLED:-false}
      SHARED_MEMORY_LLM_PHISHING_ENABLED: ${SHARED_MEMORY_LLM_PHISHING_ENABLED:-false}
      # L2 响应策略 YAML（运行时目录；entrypoint 从镜像种子补齐）
      RESPONSE_POLICIES_DIR: ${RESPONSE_POLICIES_DIR:-/data/response_policies}
      RESPONSE_TAXONOMY_PATH: ${RESPONSE_TAXONOMY_PATH:-/data/response_policies/taxonomy.yml}
      RESPONSE_POLICY_RELOAD_SEC: ${RESPONSE_POLICY_RELOAD_SEC:-30}
      RESPONSE_TAXONOMY_RELOAD_SEC: ${RESPONSE_TAXONOMY_RELOAD_SEC:-30}
      RESPONSE_UNCERTAIN_ENABLED: ${RESPONSE_UNCERTAIN_ENABLED:-true}
    volumes:
      # 挂载专用 soc-firewall 密钥（性能验证用，test only，未做 from/no-pty 等加固）
      - ./config/ssh/firewall_key:/tmp/ssh/firewall_key:ro
      # v4 修复(2026-09-01):同时挂到 entrypoint 期望路径,让 ssh_transport 真正可用
      # entrypoint.sh 启动时 if [ -f /tmp/ssh-keys/id_rsa ] → cp 到 /tmp/ssh/ 和 /root/.ssh/
      # 之前只挂 /tmp/ssh/firewall_key,entrypoint 永远找不到, ssh_transport 走 stub
      - ./config/ssh/firewall_key:/tmp/ssh-keys/id_rsa:ro
      # L2/L3: 运营新增/修改的响应策略 + taxonomy 跨重建持久化
      - response-policies-data:/data/response_policies
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      temporal:
        condition: service_started

  frontend:
    image: ghcr.io/x2789279228-droid/soc-frontend:${IMAGE_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shared-memory-frontend
    restart: always
    ports:
      - "3001:80"     # Web 前端
      - "3002:8080"   # Flink Dashboard 认证反代 (Basic Auth)
      # 注: 3004 端口 dev compose 启动时会被覆盖为 "3004:3000" (vite dev server)
      # 如果只跑 prod, 3004 不可用; 跑 dev 时 3004 走 vite HMR
    volumes:
      # 生成方式见 tools/gen-htpasswd.sh
      - ./config/nginx/flink.htpasswd:/etc/nginx/flink.htpasswd:ro
    depends_on:
      - backend
      - flink-jobmanager

  # ── Temporal Worker (4 层 Agent 编排的执行者; 独立进程跑 workflow/activity) ──
  temporal-worker:
    image: ghcr.io/x2789279228-droid/soc-backend:${IMAGE_TAG:-dev}
    container_name: soc-temporal-worker
    restart: always
    command: ["python", "-m", "temporal.worker"]
    environment:
      SHARED_MEMORY_DATABASE_URL: postgresql+asyncpg://admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/shared_memory
      SHARED_MEMORY_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      SHARED_MEMORY_LLM_API_KEY: ${SHARED_MEMORY_LLM_API_KEY:?LLM_API_KEY_REQUIRED}
      SHARED_MEMORY_LLM_BASE_URL: ${SHARED_MEMORY_LLM_BASE_URL:-https://api.xiaomimimo.com/v1}
      SHARED_MEMORY_LLM_MODEL: ${SHARED_MEMORY_LLM_MODEL:-mimo-v2.5}
      SHARED_MEMORY_EMBEDDING_API_KEY: ${SHARED_MEMORY_EMBEDDING_API_KEY:?EMBEDDING_API_KEY_REQUIRED}
      SHARED_MEMORY_EMBEDDING_BASE_URL: ${SHARED_MEMORY_EMBEDDING_BASE_URL:-https://maas-api.cn-huabei-1.xf-yun.com/v2}
      SHARED_MEMORY_EMBEDDING_MODEL: ${SHARED_MEMORY_EMBEDDING_MODEL:-mimo-v2.5}
      SHARED_MEMORY_EMBEDDING_DIM: ${SHARED_MEMORY_EMBEDDING_DIM:-768}
      # v5 修复:worker 侧补齐响应执行与检索所需配置 — 此前缺失导致
      #   ① block_ip 在 worker 内 fw_ssh_host 为空 → gaierror 全部 error
      #   ② vector.search 连不上 Qdrant → 知识检索恒 0 candidates
      SHARED_MEMORY_QDRANT_URL: ${SHARED_MEMORY_QDRANT_URL:-http://qdrant:6333}
      SHARED_MEMORY_QDRANT_COLLECTION: ${SHARED_MEMORY_QDRANT_COLLECTION:-soc_knowledge_chunks}
      SHARED_MEMORY_QDRANT_VECTOR_SIZE: ${SHARED_MEMORY_QDRANT_VECTOR_SIZE:-768}
      SHARED_MEMORY_FW_SSH_HOST: ${SHARED_MEMORY_FW_SSH_HOST:-soc-firewall}
      SHARED_MEMORY_FW_SSH_PORT: ${SHARED_MEMORY_FW_SSH_PORT:-22}
      SHARED_MEMORY_FW_SSH_USER: ${SHARED_MEMORY_FW_SSH_USER:-root}
      SHARED_MEMORY_FW_SSH_PASSWORD: ${SHARED_MEMORY_FW_SSH_PASSWORD:-}
      SHARED_MEMORY_FW_USE_SUDO: ${SHARED_MEMORY_FW_USE_SUDO:-false}
      SHARED_MEMORY_RESPONSE_TRANSPORT_MODE: ${SHARED_MEMORY_RESPONSE_TRANSPORT_MODE:-auto}
      SHARED_MEMORY_RESPONSE_SSH_HOST: ${SHARED_MEMORY_RESPONSE_SSH_HOST:-host.docker.internal}
      SHARED_MEMORY_RESPONSE_SSH_PORT: ${SHARED_MEMORY_RESPONSE_SSH_PORT:-22}
      SHARED_MEMORY_RESPONSE_SSH_USER: ${SHARED_MEMORY_RESPONSE_SSH_USER:-Admin}
      SHARED_MEMORY_RESPONSE_SSH_KEY_FILE: ${SHARED_MEMORY_RESPONSE_SSH_KEY_FILE:-/tmp/ssh/id_rsa}
      # Temporal (worker 消费编排队列)
      SHARED_MEMORY_TEMPORAL_HOST: temporal:7233
      SHARED_MEMORY_TEMPORAL_NAMESPACE: default
      SHARED_MEMORY_TEMPORAL_TASK_QUEUE: audit-pipeline
      # v5 修复:并发上限 — 无上限时批量重放会打爆 LLM API (429 风暴致审计降级)
      TEMPORAL_CONCURRENCY: ${TEMPORAL_CONCURRENCY:-30}
      # OpenTelemetry (activity 内 span → collector → Tempo/Jaeger)
      SHARED_MEMORY_OTEL_ENABLED: "true"
      SHARED_MEMORY_OTEL_ENDPOINT: http://otel-collector:4317
      SHARED_MEMORY_ENV_NAME: ${SHARED_MEMORY_ENV_NAME:-dev}
      SHARED_MEMORY_FIELD_ENCRYPTION_KEY: ${SHARED_MEMORY_FIELD_ENCRYPTION_KEY:-}
      SHARED_MEMORY_ALLOWED_ORIGINS: '${SHARED_MEMORY_ALLOWED_ORIGINS:-["http://localhost:3001"]}'
      RESPONSE_POLICIES_DIR: ${RESPONSE_POLICIES_DIR:-/data/response_policies}
      RESPONSE_TAXONOMY_PATH: ${RESPONSE_TAXONOMY_PATH:-/data/response_policies/taxonomy.yml}
      RESPONSE_POLICY_RELOAD_SEC: ${RESPONSE_POLICY_RELOAD_SEC:-30}
      RESPONSE_TAXONOMY_RELOAD_SEC: ${RESPONSE_TAXONOMY_RELOAD_SEC:-30}
      RESPONSE_UNCERTAIN_ENABLED: ${RESPONSE_UNCERTAIN_ENABLED:-true}
    volumes:
      - response-policies-data:/data/response_policies
      - ./config/ssh/firewall_key:/tmp/ssh-keys/id_rsa:ro
    depends_on:
      - temporal
      - backend

  # ════════════════════════════════════════════
  # 可观测性 (标准 OpenTelemetry + Grafana Tempo/Prometheus)
  # ════════════════════════════════════════════

  # ── OpenTelemetry Collector (OTLP 接收 → 尾部采样 → Tempo) ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: soc-otel-collector
    restart: always
    command: ["--config=/etc/otel/otel-collector.yaml"]
    volumes:
      - ./config/otel/otel-collector.yaml:/etc/otel/otel-collector.yaml:ro
    # 仅容器内网 (4317 gRPC / 4318 HTTP), 不映射宿主
    depends_on:
      - tempo

  # ── Grafana Tempo (trace 存储与查询) ──
  tempo:
    image: grafana/tempo:2.10.8
    container_name: soc-tempo
    restart: always
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

  # ── Jaeger (trace 可视化; 与 Tempo 并存, collector 双写导出) ──
  # all-in-one v2: 内置 OTLP gRPC(4317)/HTTP(4318) 接收器 + Query UI(16686)
  # 经 frontend:3002/jaeger/ 反代访问; base-path 在 config/jaeger 配置。
  jaeger:
    image: jaegertracing/jaeger:2.7.0
    container_name: soc-jaeger
    restart: always
    command:
      - --config=file:/etc/jaeger/jaeger.yaml
    volumes:
      - ./config/jaeger/jaeger.yaml:/etc/jaeger/jaeger.yaml:ro
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger Query UI (本机调试, 正式走前端反代)
    depends_on:
      - backend

  # ── Temporal (4 层 Agent 编排: 可靠性/长任务/可视化; 独立 postgres 存储) ──
  temporal-postgres:
    image: postgres:16.4
    container_name: soc-temporal-postgres
    restart: always
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_PASSWORD:-temporal_dev_pwd}
      POSTGRES_DB: temporal
    ports:
      - "127.0.0.1:5434:5432"   # 仅本机调试
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.27.1
    container_name: soc-temporal
    restart: always
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_PASSWORD:-temporal_dev_pwd}
      - POSTGRES_SEEDS=temporal-postgres
      - NUM_HISTORY_SHARDS=4
      - SKIP_DEFAULT_NAMESPACE_CREATION=false
    ports:
      - "127.0.0.1:7233:7233"   # gRPC; 供 backend/worker 容器内网访问
    depends_on:
      temporal-postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.38.1
    container_name: soc-temporal-ui
    restart: always
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3002
      - TEMPORAL_UI_BASE_PATH=/temporal
    depends_on:
      - temporal

  # ── Prometheus (Flink 9250/9251 + Python /metrics, 支持 exemplar) ──
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: soc-prometheus
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # 仅本机调试
    depends_on:
      - flink-jobmanager
      - flink-taskmanager-1
      - flink-taskmanager-2
      - flink-taskmanager-3
      - backend

  # ── Grafana (Tempo + Prometheus 统一看板; 经 frontend:3002/grafana/ 反代) ──
  grafana:
    image: grafana/grafana:12.3.8
    container_name: soc-grafana
    restart: always
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3002/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # 仅本机调试
    depends_on:
      - tempo
      - prometheus

  # ════════════════════════════════════════════
  # NDR 扩展服务 (可选, 按需启用)
  # ════════════════════════════════════════════

  # ── Suricata IDS/IPS ──
  suricata:
    image: jasonish/suricata:8.0.6
    container_name: soc-suricata
    restart: unless-stopped
    profiles: ["ndr"]
    command: -i eth0 -o /var/log/suricata/eve.json
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      SURICATA_OPTIONS: "-v"
    volumes:
      - suricata_logs:/var/log/suricata
      - suricata_rules:/var/lib/suricata/rules
      - ./config/suricata:/etc/suricata/custom:ro
    network_mode: host

  # ── CAPE Sandbox (恶意软件动态分析) ──
  # NOTE: `capev2/cape` 在 Docker Hub 不存在 (无官方镜像)。本服务列为可选(optional)。
  #   演示: 用 backend/tests/inc_mock_servers.py 的 mock CAPE(本地, 零外部依赖)替代,
  #         将 SHARED_MEMORY_SANDBOX_API_URL 指向 mock; 真实生产请自建 CAPE 并锁版本镜像。
  cape:
    image: capev2/cape:latest   # ← 无官方镜像, 演示请勿启用; 需随自建镜像替换
    container_name: soc-cape
    restart: unless-stopped
    profiles: ["sandbox", "optional"]
    ports:
      - "8090:8090"
    volumes:
      - cape_data:/data
    environment:
      CAPE_API_KEY: ${CAPE_API_KEY:-}

  # ── MISP 威胁情报平台 ──
  misp:
    image: coolacid/misp-docker:core-v2.4.177a
    container_name: soc-misp
    restart: unless-stopped
    profiles: ["intel"]
    ports:
      - "8443:443"
    environment:
      MYSQL_HOST: misp-db
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:?MISP_DB_PASSWORD must be set in .env}
      MISP_ADMIN_EMAIL: admin@soc.local
      MISP_ADMIN_PASSPHRASE: ${MISP_ADMIN_PASSWORD:?MISP_ADMIN_PASSWORD must be set in .env}
    depends_on:
      - misp-db

  misp-db:
    image: mysql:8.0.39
    container_name: soc-misp-db
    restart: unless-stopped
    profiles: ["intel"]
    environment:
      MYSQL_DATABASE: misp
      MYSQL_USER: misp
      MYSQL_PASSWORD: ${MISP_DB_PASSWORD:?MISP_DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MISP_ROOT_PASSWORD:?MISP_ROOT_PASSWORD must be set in .env}
    volumes:
      - misp_db_data:/var/lib/mysql

volumes:
  pgdata:
  qdrant_data:
  kafka_data:
  flink_state:
  suricata_logs:
  suricata_rules:
  cape_data:
  misp_db_data:
  tempo_data:
  prometheus_data:
  grafana_data:
  jaeger_data:
  temporal_postgres_data:
  response-policies-data:
