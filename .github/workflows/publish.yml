# ════════════════════════════════════════════
# Publish — 镜像版本化 (GHCR)
# 触发: push main → :main + :sha-<7>; 打 v* 标签 → :<semver> + :latest
# 镜像: ghcr.io/<owner>/soc-{backend,frontend,flink}
# ════════════════════════════════════════════
name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push GHCR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend, flink]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/soc-${{ matrix.image }}
          tags: |
            # main 分支 → :main; 版本标签 → :<semver>
            type=ref,event=branch
            type=semver,pattern={{version}}
            # 每个构建附短 commit sha, 可精确回滚
            type=sha,prefix=sha-
            # 仅正式版本标签附加 :latest
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max