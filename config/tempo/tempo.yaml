# ── Grafana Tempo 配置 ──
# 单节点, 本地文件后端, 30 天保留; OTLP gRPC 4317 / HTTP 4318 / Query 3200
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1048576

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    block:
      version: vParquet3

compactor:
  compaction:
    block_retention: 720h  # 30 天

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/metrics

overrides:
  metrics_generator_processors: [service-graphs, span-metrics]
