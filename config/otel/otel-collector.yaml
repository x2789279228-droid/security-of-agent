# ── OpenTelemetry Collector 配置 ──
# 接收 Flink/Python 的 OTLP traces → 批量 → 双写导出 Grafana Tempo + Jaeger
# 端口: OTLP gRPC 4317 / OTLP HTTP 4318 (仅容器内网)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 512
  # 注: 尾部采样 (tail_sampling) 在本版本(0.159.0)存在丢弃问题, 已移除;
  # 当前 SOC 事件量级下全量导出 (保真优先), 关键 span 由 SDK 侧 soc.importance 标记,
  # 供 Grafana/Jaeger 按重要性过滤。完整策略见 docs/otel_sampling.md。
  # 告警/审计 = important; 常规事件 = normal (backend pipeline_tracer/kafka_consumer/http + flink TraceUtil 已统一)。

exporters:
  # 用 otlp_http (Tempo HTTP 4318, 已验证可用)
  otlp_http/tempo:
    endpoint: http://tempo:4318
  # Jaeger v1 all-in-one 的 OTLP HTTP 接收端 (4318)
  otlp_http/jaeger:
    endpoint: http://jaeger:4318
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/tempo, otlp_http/jaeger, debug]
